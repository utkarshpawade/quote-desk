name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://quotedesk:quotedesk@localhost:5432/quotedesk?schema=public
  DIRECT_URL: postgresql://quotedesk:quotedesk@localhost:5432/quotedesk?schema=public

jobs:
  checks:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quotedesk
          POSTGRES_PASSWORD: quotedesk
          POSTGRES_DB: quotedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quotedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The re-seeding integration suite gets its own database.
      TEST_DATABASE_URL: postgresql://quotedesk:quotedesk@localhost:5432/quotedesk_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate both databases
        run: |
          npx prisma migrate deploy
          PGPASSWORD=quotedesk psql -h localhost -U quotedesk -d quotedesk -c "CREATE DATABASE quotedesk_test"
          DIRECT_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quotedesk
          POSTGRES_PASSWORD: quotedesk
          POSTGRES_DB: quotedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quotedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Seed demo data
        run: npx tsx prisma/seed.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
